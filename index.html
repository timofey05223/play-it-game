<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#12121f">
<title>Play It Game</title>
<style>
:root{
  --bg:#12121f;--card:#1d1d31;--card2:#26263f;--text:#f2f2fa;--muted:#9a9ab8;
  --accent:#7c5cff;--accent2:#ff5d8f;--ok:#2fd28a;--bad:#ff4d5e;--warn:#ffb020;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%;overscroll-behavior:none}
body{background:radial-gradient(1200px 600px at 50% -200px,#2a2050 0,var(--bg) 70%) fixed}
#app{max-width:520px;margin:0 auto;padding:12px 16px 30px;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{margin:.2em 0}
.logo{font-size:44px;font-weight:900;text-align:center;margin-top:28px;letter-spacing:-1px}
.logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);margin:4px 0 28px}
label{display:block;color:var(--muted);font-size:14px;margin:14px 0 6px}
input,textarea{width:100%;background:var(--card);border:2px solid var(--card2);color:var(--text);border-radius:14px;padding:14px;font:inherit;font-size:18px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:none;height:110px}
.code-in{text-align:center;text-transform:uppercase;letter-spacing:10px;font-size:28px;font-weight:800}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;margin-top:12px;font:inherit;font-size:18px;font-weight:700;color:var(--text);background:var(--card2);cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.btn:disabled{opacity:.4}
.btn.small{font-size:15px;padding:10px}
.or{text-align:center;color:var(--muted);margin:26px 0 4px;font-size:14px}
.err{color:var(--bad);text-align:center;min-height:1.4em;margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;padding:4px 2px 10px;gap:8px}
.top .code{font-weight:800;color:var(--text);letter-spacing:2px}
.timer{font-weight:800;font-size:20px;color:var(--text);min-width:40px;text-align:right}
.timer.low{color:var(--bad)}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px}
.center{text-align:center}
.muted{color:var(--muted);font-size:14px}
.bigcode{font-size:56px;font-weight:900;letter-spacing:10px;margin:4px 0}
#qr{display:flex;justify-content:center;margin:8px 0}
#qr img,#qr canvas{background:#fff;padding:8px;border-radius:12px}
.pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--card2)}
.pl:last-child{border-bottom:0}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.pl .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .sc{font-weight:800}
.pl.off{opacity:.4}
.tag{font-size:12px;background:var(--card2);padding:2px 8px;border-radius:99px;color:var(--muted)}
.seg{display:flex;gap:8px}
.seg .btn{margin-top:6px}
.seg .btn.on{background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{border:0;border-radius:99px;padding:8px 12px;background:var(--card2);color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.chip:disabled{cursor:default}
.grp{font-size:13px;color:var(--muted);margin-top:10px}
.title{font-size:30px;font-weight:900;text-align:center;margin:18px 0 6px}
.rules{text-align:center;color:var(--muted);font-size:17px;margin-bottom:20px}
.q{font-size:26px;font-weight:800;text-align:center;margin:14px 0 18px}
.q.huge{font-size:46px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .btn{margin:0;font-size:24px;padding:22px 8px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid5 .btn{margin:0;font-size:26px;padding:20px 0}
.opts .btn{text-align:left;font-size:20px}
.waitbox{text-align:center;padding:30px 10px;color:var(--muted);font-size:18px}
.waitbox b{display:block;color:var(--text);font-size:22px;margin-bottom:6px}
.react{flex:1;min-height:60vh;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer}
.react.wait{background:var(--bad)}
.react.go{background:var(--ok);color:#06331f}
.react.done{background:var(--card);font-size:26px;text-align:center;padding:20px}
.reveal{font-size:22px;font-weight:800;text-align:center;margin:8px 0 14px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--card2)}
.row:last-child{border-bottom:0}
.row .info{flex:1;min-width:0}
.row .info .d{color:var(--muted);font-size:14px;word-wrap:break-word}
.pts{font-weight:900;font-size:18px;min-width:44px;text-align:right}
.pts.p{color:var(--ok)}.pts.n{color:var(--bad)}.pts.z{color:var(--muted)}
.ans .btn{text-align:left;font-weight:600;font-size:18px}
.ans .btn.own{opacity:.4}
.banner{background:#3a2a10;color:var(--warn);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:10px;text-align:center}
.podium{font-size:60px;text-align:center;margin-top:10px}
.spacer{flex:1}
.progress{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin:-4px 0 10px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s linear}
/* экшен-режимы */
.rtwrap{position:relative;display:flex;flex-direction:column;gap:8px;touch-action:none;user-select:none;-webkit-user-select:none;flex:1}
.cw{display:flex;justify-content:center}
#cv{border-radius:16px;display:block;touch-action:none;background:#1a1a2e}
#cv.paper{background:#fff}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:800;min-height:28px;gap:8px;font-size:17px}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:4px}
.dashbtn{border:0;border-radius:50%;width:86px;height:86px;flex:none;font-size:16px;font-weight:900;background:linear-gradient(135deg,#ffb020,#ff5d8f);color:#fff;touch-action:none}
.dashbtn:active{transform:scale(.92)}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);pointer-events:none;display:none;z-index:50}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(255,255,255,.6)}
.tapbtn{border:0;border-radius:28px;min-height:36vh;font-size:40px;font-weight:900;color:#fff;touch-action:none;transition:transform .05s}
.tapbtn:active{transform:scale(.95)}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #555;cursor:pointer}
.sw.on{border-color:#fff;transform:scale(1.15)}
.tb{background:var(--card2);border:0;color:var(--text);border-radius:10px;padding:7px 10px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.tb.on{background:var(--accent)}
.chat{font-size:15px;min-height:44px;display:flex;flex-direction:column;justify-content:flex-end}
.chat .ok{color:var(--ok);font-weight:700}
.chat .cl{color:var(--warn)}
.gform{display:flex;gap:8px}.gform input{flex:1;padding:12px}.gform .btn{width:auto;margin:0;padding:0 20px}
.bomb{font-size:110px;text-align:center;animation:pulse .6s infinite;line-height:1.2}
.bomb.me{font-size:140px;animation:shake .22s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes shake{25%{transform:rotate(-9deg) scale(1.06)}75%{transform:rotate(9deg) scale(1.06)}}
.tapbtn.small{min-height:20vh;font-size:22px;border-radius:22px}
.bln{text-align:center;line-height:1.1;min-height:250px;display:flex;align-items:center;justify-content:center;transition:font-size .08s}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(100%,58vh);margin:0 auto;aspect-ratio:1}
.pad{border-radius:26px;background:var(--c);opacity:.3;transition:opacity .08s,box-shadow .08s;cursor:pointer}
.pad.on{opacity:1;box-shadow:0 0 34px var(--c)}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:19px;line-height:1;vertical-align:middle}
.av.big{width:40px;height:40px;font-size:26px;margin-left:6px}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
.avb{border:2px solid transparent;background:var(--card2);border-radius:10px;font-size:22px;padding:4px 0;cursor:pointer}
.avb.on{border-color:var(--accent);background:#3a2f70}
.avb:disabled{opacity:.25}
.seg .btn.on:disabled{opacity:1}
.mega{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;border:2px solid var(--card2);background:var(--card2);color:var(--text);border-radius:16px;padding:12px 14px;margin-top:8px;font:inherit;cursor:pointer}
.mega b{font-size:19px}.mega span{color:var(--muted);font-size:14px}.mega i{font-style:normal;font-size:12px;color:var(--warn)}
.mega.on{border-color:var(--accent);background:#2c2560}
.mega:disabled{cursor:default}
.snd{background:none;border:0;font-size:18px;cursor:pointer;padding:0 6px;vertical-align:middle}
.pitem{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:16px;padding:10px;margin-bottom:10px;animation:pin .3s}
@keyframes pin{from{opacity:0;transform:translateY(10px)}}
.pbody{flex:1;min-width:0}.ptxt{font-size:22px;font-weight:800;margin:4px 0}
.pcv{display:block;border-radius:12px;margin:6px 0;background:#fff}
.like{border:0;background:var(--card2);color:#ff7a9a;border-radius:99px;padding:6px 14px;font:inherit;font-weight:800;cursor:pointer}
.like:disabled{opacity:.5}
.hctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hb{border:0;border-radius:14px;padding:12px 12px;font:inherit;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,#7c5cff,#ff5d8f);touch-action:none;cursor:pointer}
.hb:disabled{opacity:.45}
.royale .ctrl{min-height:96px}
.r3d{width:100%;aspect-ratio:4/3;border-radius:14px;image-rendering:pixelated;background:#000;touch-action:none}
.fire{background:linear-gradient(135deg,#ff4d5e,#ffb020)}
.rhud{display:flex;flex-direction:column;gap:4px}
.bars{display:flex;gap:6px}.bar{flex:1;height:20px;background:#2a2a40;border-radius:8px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;transition:width .2s}.bar.hp i{background:#e8364f}.bar.ar i{background:#4cc9f0}
.bar span{position:relative;font-size:12px;font-weight:800;padding-left:6px;line-height:20px}
.rinfo{display:flex;gap:12px;font-size:14px;font-weight:700}
.feed{position:absolute;left:8px;top:64px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
body.royale-on{overflow:hidden}
body.royale-on #app{max-width:none;padding:0;min-height:100vh;min-height:100dvh}
body.royale-on .top,body.royale-on .progress,body.royale-on .banner{display:none}
.royale.full{position:fixed;inset:0;z-index:10;background:#000;display:block;gap:0}
.royale.full .r3d{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0}
.royale.full .rhud{position:absolute;left:10px;top:8px;width:min(46%,340px);z-index:2;pointer-events:none}
.royale.full .rinfo{text-shadow:0 1px 3px #000}
.royale.full .ctrl{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;min-height:0;pointer-events:none;align-items:flex-end}
.royale.full .ctrl .muted{opacity:.55;text-shadow:0 1px 2px #000}
.royale.full .fire{pointer-events:auto;width:100px;height:100px;opacity:.9}
.royale.full .feed{top:70px}
.rot{display:none}
.fsask{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:4px}
.fsask .btn{max-width:340px}
@media (orientation:portrait){
  .royale.full .r3d{top:96px;bottom:auto;height:auto;aspect-ratio:4/3}
  .royale.full .rhud{width:auto;right:10px}
  .rot{display:block;position:absolute;left:0;right:0;top:calc(96px + 75vw + 12px);text-align:center;color:var(--warn);font-weight:800;font-size:17px;pointer-events:none}
}
.deadui{position:absolute;left:50%;transform:translateX(-50%);z-index:5;display:none;align-items:center;gap:6px;background:rgba(0,0,0,.65);border-radius:16px;padding:8px 10px;color:#fff;font-weight:800}
.deadui.choose{display:flex;flex-direction:column;top:30%;padding:16px;min-width:260px}
.deadui.spec,.deadui.snake{display:flex;bottom:12px}
.deadui .dtitle{font-size:20px;margin-bottom:4px}
.rtwrap.dead .fire{display:none}
.fsbtn{position:absolute;left:50%;transform:translateX(-50%);top:8px;z-index:6;width:40px;height:40px;border:0;border-radius:12px;background:rgba(0,0,0,.5);color:#fff;font-size:22px;cursor:pointer}
@media (orientation:portrait){.fsbtn{top:52px}}
.shop{position:absolute;right:10px;top:84px;z-index:6;display:none;flex-direction:column;gap:4px;background:rgba(0,0,0,.7);border-radius:14px;padding:8px;max-width:230px}
.shop .shtitle{font-weight:800;color:#ffd23f;margin-bottom:2px}
.shop .tb{text-align:left}
.shop .tb:disabled{opacity:.4}
.use{background:linear-gradient(135deg,#3ddc97,#2f7cf6);font-size:12px;width:auto!important;min-width:100px;padding:0 10px;border-radius:20px!important;pointer-events:auto;line-height:1.2}
.royale.full .ctrl .use{height:70px;margin-right:8px}
.bench{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;display:none;flex-direction:column;gap:6px;background:rgba(10,10,25,.92);border:2px solid #ffd23f;border-radius:16px;padding:12px;width:min(92%,340px)}
.brow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}.brow i{color:var(--muted);font-size:12px;font-style:normal}
.boom{text-align:center;color:var(--warn);font-weight:800;font-size:20px;margin-top:6px}
</style>
</head>

function hostBump(list,dist,bounce){
  const now=Date.now(); H.bumpT=H.bumpT||{};
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const [ia,a]=list[i],[ib,b]=list[j], dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
    if(d>=dist||d<=0) continue;
    const key=ia<ib?ia+ib:ib+ia; if(now-(H.bumpT[key]||0)<200) continue; H.bumpT[key]=now;
    const nx=dx/d, ny=dy/d, o=(dist-d)/2+2, rel=Math.max(0,(a.vx-b.vx)*nx+(a.vy-b.vy)*ny), k=rel*bounce+120;
    a.x-=nx*o; a.y-=ny*o; b.x+=nx*o; b.y+=ny*o; a.vx-=k*nx; a.vy-=k*ny; b.vx+=k*nx; b.vy+=k*ny;
    H.kb=H.kb||{};
    const add=(id,vx,vy,px,py)=>{const q=H.kb[id]||(H.kb[id]=[0,0,0,0]); q[0]+=vx;q[1]+=vy;q[2]+=px;q[3]+=py};
    add(ia,-k*nx,-k*ny,-nx*o,-ny*o); add(ib,k*nx,k*ny,nx*o,ny*o);
  }
}

function genMaze(N){
  const g=new Array(N*N).fill(1), st=[[1,1]]; g[N+1]=0;
  while(st.length){
    const [x,y]=st[st.length-1];
    const nb=[[2,0],[-2,0],[0,2],[0,-2]].map(([dx,dy])=>[x+dx,y+dy,dx,dy]).filter(([nx,ny])=>nx>0&&ny>0&&nx<N-1&&ny<N-1&&g[ny*N+nx]);
    if(!nb.length){st.pop();continue}
    const [nx,ny,dx,dy]=nb[rnd(nb.length)]; g[(y+dy/2)*N+x+dx/2]=0; g[ny*N+nx]=0; st.push([nx,ny]);
  }
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++) if(g[y*N+x]&&(x+y)%2===1&&Math.random()<.18) g[y*N+x]=0;
  for(let k=0;k<Math.floor(N/5);k++){const rx=1+rnd(N-5), ry=1+rnd(N-5); for(let y=ry;y<ry+3;y++)for(let x=rx;x<rx+3;x++) g[y*N+x]=0}
  const c=Math.floor(N/2); for(let y=c-2;y<=c+2;y++)for(let x=c-2;x<=c+2;x++) g[y*N+x]=0;
  return g;
}
// луч по клеткам (DDA): расстояние до стены в клетках
function rayDDA(px,py,dx,dy,N,g,win){
  let mx=Math.floor(px), my=Math.floor(py); const ddx=Math.abs(1/dx)||1e9, ddy=Math.abs(1/dy)||1e9;
  let sx,sy,sdx,sdy;
  if(dx<0){sx=-1;sdx=(px-mx)*ddx}else{sx=1;sdx=(mx+1-px)*ddx}
  if(dy<0){sy=-1;sdy=(py-my)*ddy}else{sy=1;sdy=(my+1-py)*ddy}
  let side=0;
  for(let i=0;i<220;i++){
    if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}
    if(mx<0||my<0||mx>=N||my>=N) return{d:side?sdy-ddy:sdx-ddx,side,t:1};
    const t=g.charCodeAt(my*N+mx)-48;
    if(t===6&&win){if(win.d<0){win.d=side?sdy-ddy:sdx-ddx; win.side=side; win.k=my*N+mx} continue}
    if(t>0) return{d:side?sdy-ddy:sdx-ddx,side,t};
  }
  return{d:220,side:0,t:1};
}

function genMath(){

  else if(t===1){const x=60+rnd(140),y=11+rnd(x-20);q=`${x} − ${y}`;a=x-y}
  else if(t===2){const x=3+rnd(17),y=3+rnd(9);q=`${x} × ${y}`;a=x*y}
  else if(t===3){const y=2+rnd(11),z=3+rnd(14);q=`${y*z} ÷ ${y}`;a=z}
  else {const x=2+rnd(9),y=2+rnd(9),z=1+rnd(20);q=`${x} × ${y} + ${z}`;a=x*y+z}
  const o=new Set([a]);
  while(o.size<4){const d=[1,2,3,10,-1,-2,-3,-10,9,11][rnd(10)]; if(a+d>=0) o.add(a+d)}

}

  },
  snap(){return{p:Object.entries(H.ent).map(([i,e])=>[i,Math.round(e.x),Math.round(e.y),e.stun>0?1:0]),c:H.coins.map(c=>[c.id,Math.round(c.x),Math.round(c.y),c.v]),w:H.saws.map(s=>[Math.round(s.x),Math.round(s.y)]),s:H.sc}},
  finish(){
    const ids=Object.keys(H.sc).sort((a,b)=>H.sc[b]-H.sc[a]), detail={};
    ids.forEach(id=>detail[id]=`монет: ${H.sc[id]} 🪙`);
    return{gains:rankGains(ids.filter(id=>H.sc[id]>0)),detail,reveal:ids.length?`Богач: ${nm(ids[0])} 💰`:''};
  }
 },
 lava:{
  start(){H.ent=ringSpawn([...H.part],250); for(const id in H.ent) H.ent[id].alive=true; H.tiles=new Array(64).fill(0); H.out=[]; H.lp='calm'; H.pt=2; H.cyc=0; setT(60000,finish)},
  input(pid,d){if('x' in d) H.input[pid]=vec(d)},
  tick(dt){
    const al=Object.entries(H.ent).filter(([,e])=>e.alive);
    H.pt-=dt;
    if(H.pt<=0){
      if(H.lp==='calm'){const n=Math.round(64*Math.min(.78,.3+H.cyc*.06)); shuffle([...Array(64).keys()]).slice(0,n).forEach(i=>H.tiles[i]=1); H.lp='warn'; H.pt=Math.max(.9,1.7-H.cyc*.08)}
      else if(H.lp==='warn'){H.tiles=H.tiles.map(t=>t?2:0); H.lp='lava'; H.pt=1.1}
      else {H.tiles.fill(0); H.lp='calm'; H.pt=.7; H.cyc++}
    }
    if(H.lp==='lava'&&!H.ending) for(const [id,e] of al){if(H.tiles[Math.floor(e.y/125)*8+Math.floor(e.x/125)]===2){e.alive=false;H.out.push(id)}}
    if(Object.values(H.ent).filter(e=>e.alive).length<=1&&Object.keys(H.ent).length>=2&&!H.ending){H.ending=true;setTimeout(finish,1200)}
  },
  snap(){return{p:Object.entries(H.ent).map(([i,e])=>[i,Math.round(e.x),Math.round(e.y),e.alive?1:0]),t:H.tiles.join('')}},
  finish(){
    const al=Object.keys(H.ent).filter(id=>H.ent[id].alive), order=[...al,...H.out.slice().reverse()], detail={};
    order.forEach(id=>detail[id]=H.ent[id].alive?'не сгорел 🧊':`сгорел ${H.out.indexOf(id)+1}-м 🔥`);
    return{gains:al.length>1?Object.fromEntries(al.map(id=>[id,2])):rankGains(order),detail,reveal:al.length===1?`Последний выживший: ${nm(al[0])} 🧊`:al.length?`Выжили: ${al.map(nm).join(', ')}`:'Все сгорели 🔥'};
  }
 },
 balloon:{
  start(){H.bal=0; H.tot={}; H.part.forEach(id=>H.tot[id]=0); H.wait=0; this.nb(); setT(60000,finish)},
  nb(){H.bal++; H.lim=10+rnd(40); H.st={}; H.part.forEach(id=>H.st[id]={n:0,s:'p'}); H.bt=Date.now(); H.rev=null},
  input(pid,d){
    const s=H.st[pid]; if(!s||s.s!=='p'||H.wait) return;
    if(d.pump){const n=clamp(d.pump|0,0,6); for(let k=0;k<n;k++){s.n++; if(s.n>=H.lim){s.s='b';break}}}
    if(d.cash&&s.s==='p'&&s.n>0){s.s='c'; H.tot[pid]+=s.n}
  },
  tick(){
    if(H.wait){if(Date.now()>H.wait){H.wait=0; if(H.bal>=3) return finish(); this.nb()} return}
    const st=Object.values(H.st);
    if(st.every(s=>s.s!=='p')||Date.now()-H.bt>15000){st.forEach(s=>{if(s.s==='p'&&s.n>0) s.s='b'}); H.rev=H.lim; H.wait=Date.now()+2500}
  },
  snap(){return{b:H.bal,st:Object.entries(H.st).map(([id,s])=>[id,s.n,s.s]),tot:H.tot,rev:H.rev,tl:H.wait?0:Math.max(0,15000-(Date.now()-H.bt))}},
  finish(){
    const ids=Object.keys(H.tot).sort((a,b)=>H.tot[b]-H.tot[a]), detail={};
    ids.forEach(id=>detail[id]=`накачал: ${H.tot[id]} 🎈`);
    return{gains:rankGains(ids.filter(id=>H.tot[id]>0)),detail,reveal:ids.length?`Лучший надуватель: ${nm(ids[0])} 🎈`:''};
  }
 },
 simon:{
  start(){S.data.seed=rnd(1e9); H.lv={}; H.lt={}; H.out={}; H.part.forEach(id=>H.lv[id]=0); S.data.lv=H.lv; S.data.out=H.out; setT(75000,finish)},
  input(pid,d){
    if(H.out[pid]) return;
    if(typeof d.lv==='number'){const l=clamp(d.lv|0,0,60); if(l===H.lv[pid]+1){H.lv[pid]=l; H.lt[pid]=Date.now()}}
    if(d.out){H.out[pid]=1; S.data.done.push(pid); if(!checkAllDone()) broadcast()}
  },
  snap(){return{lv:H.lv,out:Object.keys(H.out)}},
  finish(){
    const ids=Object.keys(H.lv).sort((a,b)=>H.lv[b]-H.lv[a]||(H.lt[a]||0)-(H.lt[b]||0)), detail={};
    ids.forEach(id=>detail[id]=`уровень ${H.lv[id]}${H.out[id]?' ❌':' 💪'}`);
    return{gains:rankGains(ids.filter(id=>H.lv[id]>0)),detail,reveal:ids.length?`Лучшая память: ${nm(ids[0])} — уровень ${H.lv[ids[0]]} 🧠`:''};
  }
 },
 croc:{
  start(){
    const ids=online().map(p=>p.id); H.crocI=(H.crocI??-1)+1;
    const dr=ids[H.crocI%ids.length];
    H.word=draw('croc',WORDS); H.strokes={}; H.skipped=false; H.hints=0; H.t0=Date.now();
    S.data={done:[dr],drawer:dr,hint:H.word.replace(/[^\s-]/g,'_'),guessed:[],chat:[]};
    setT(80000,finish);
  },
  tick(){
    const el=Date.now()-H.t0;
    if((H.hints===0&&el>40000)||(H.hints===1&&el>60000)){
      H.hints++; const h=S.data.hint.split(''), free=h.map((c,i)=>c==='_'?i:-1).filter(i=>i>=0);
      if(free.length>1){const i=free[rnd(free.length)]; h[i]=H.word[i]; S.data.hint=h.join(''); broadcast()}
    }
  },
  act(pid,a){
    const d=S.data;
    if(a.k==='guess'){
      if(pid===d.drawer||d.guessed.includes(pid)) return;
      const t=String(a.text||'').trim().slice(0,30); if(!t) return;
      const n=normW(t), w=normW(H.word), p=getP(pid);
      if(n===w){d.guessed.push(pid); d.done.push(pid); d.chat.push({n:p.name,c:p.color,ok:1})}
      else d.chat.push({n:p.name,c:p.color,t,cl:w.length>=4&&lev(n,w)<=1?1:0});
      d.chat=d.chat.slice(-5);
      if(!checkAllDone()) broadcast();
    }
    else if(pid===d.drawer&&a.k==='clear'){H.strokes={}; sendRt({clear:1},pid)}
    else if(pid===d.drawer&&a.k==='skip'&&!H.skipped){
      H.skipped=true; H.word=draw('croc',WORDS); H.hints=0; H.t0=Date.now()-Math.min(Date.now()-H.t0,20000);
      d.hint=H.word.replace(/[^\s-]/g,'_'); d.skipped=true; H.strokes={}; sendRt({clear:1}); broadcast();
    }
  },
  input(pid,d){
    if(pid!==S.data.drawer||!Array.isArray(d.s)) return;
    const [id,c,w,pts]=d.s; if(!Array.isArray(pts)||pts.length>800) return;
    const s=H.strokes[id]||(H.strokes[id]={c:String(c).slice(0,9),w:clamp(+w||6,2,60),p:[]});
    const clean=pts.map(n=>clamp(Math.round(+n||0),0,1000)); s.p.push(...clean);
    sendRt({d:[[id,s.c,s.w,clean]]},pid);
  },
  finish(){
    const d=S.data, gains={}, detail={};
    d.guessed.forEach((id,i)=>{gains[id]=i===0?3:i===1?2:1; detail[id]=`угадал ${i+1}-м ✅`});
    gains[d.drawer]=d.guessed.length?Math.min(3,1+d.guessed.length):0; detail[d.drawer]='рисовал ✏️';
    [...H.part].forEach(id=>{if(!detail[id]) detail[id]='не угадал'});
    return{gains,detail,reveal:`Слово было: ${H.word}`};
  }
 },
};

let joinTimeout=null, fastConn=null, rejoining=false, autoRejoin=0;
function joinRoom(code,name,auto){
  lastCode=code; lastName=name; rejoining=!!auto;
  if(noPeer()) return;
  try{peer&&peer.destroy()}catch(e){}
  hostConn=null; fastConn=null;
  ui='connecting'; render();
  peer=new Peer();
  clearTimeout(joinTimeout);
  joinTimeout=setTimeout(()=>{if(ui==='connecting') fail('Не получилось подключиться. Проверь код и интернет.')},15000);
  peer.on('open',()=>{
    const c=peer.connect(PREFIX+code,{reliable:true,serialization:'json'}); hostConn=c;
    c.on('open',()=>c.send({t:'join',id:myId,name}));
    c.on('data',m=>{
      if(m.t==='rt') onRt(m.d);
      else if(m.t==='state'){
        clearTimeout(joinTimeout); ui='game'; rejoining=false; autoRejoin=0;
        if(!fastConn) openFast(code);
        onState(m.s);
      }
      else if(m.t==='you'){myId=m.id; store('sessionStorage','up_id',myId)}
      else if(m.t==='err') fail(m.msg);
    });
    c.on('close',()=>{if(hostConn===c&&ui==='game') lost()});
  });
  peer.on('error',e=>{
    if(e.type==='peer-unavailable') fail('Комната «'+code+'» не найдена (хост вышел?)');
    else if(ui==='connecting') fail(netErr(e)||'Ошибка связи: '+e.type);
    else if(ui==='game'&&e.type==='network') lost();
  });
}
// второй канал без очерёдности: позиции не ждут потерянные пакеты
function openFast(code){
  try{
    const f=peer.connect(PREFIX+code,{reliable:false,serialization:'json',metadata:{fast:1}}); fastConn=f;
    f.on('open',()=>f.send({t:'hello',id:myId}));
    f.on('data',m=>{if(m&&m.t==='rt') onRt(m.d)});
    f.on('close',()=>{if(fastConn===f) fastConn=null});
  }catch(e){fastConn=null}
}
function lost(){
  ui='lost'; render();
  if(autoRejoin<3){autoRejoin++; setTimeout(()=>{if(ui==='lost') joinRoom(lastCode,lastName,true)},1500)}
}
function fail(msg){
  err=msg; try{peer&&peer.destroy()}catch(e){}
  if(rejoining){ui='lost'; render(); return}
  ui='home'; isHost=false; render();
}
setInterval(()=>{if(!isHost&&hostConn&&hostConn.open) try{hostConn.send({t:'hb'})}catch(e){}},2000);
function send(a){
  if(isHost) handleAct(myId,a);
  else if(hostConn&&hostConn.open) hostConn.send({t:'act',a});
}
function sendIn(d){
  if(isHost) hostInput(myId,d);
  else if(fastConn&&fastConn.open) fastConn.send({t:'in',d});
  else if(hostConn&&hostConn.open) hostConn.send({t:'in',d});
}
function stateKey(s){return s.round+':'+s.phase+':'+(s.data&&s.data.stage||'')}
function onState(s){
  soundEvents(view,s);
  view=s;
  localDeadline=s.endsIn!=null?Date.now()+s.endsIn:null;
  const k=stateKey(s);
  if(!seen[k]){seen[k]=performance.now(); phaseTotal=s.endsIn||1}
  render();
}
function soundEvents(a,b){
  if(!b) return;
  const d=b.data||{}, pd=a&&a.data||{}, newPhase=!a||a.phase!==b.phase||a.round!==b.round;
  if(newPhase){
    if(b.phase==='intro') sfx('start');
    else if(b.phase==='final') sfx('win');
    else if(b.phase==='results'){const me=(d.rows||[]).find(r=>r.name===b.players.find(p=>p.id===myId)?.name); sfx(me&&me.pts>0?'good':me&&me.pts<0?'bad':'click')}
  }
  if(b.phase!=='play') return;
  if(b.game==='react'&&d.stage==='go'&&pd.stage!=='go') sfx('go');
  if(b.game==='bomb'){if(d.boom&&d.boom!==pd.boom) sfx('boom'); else if(d.holder===myId&&pd.holder!==myId) sfx('alarm')}
  if(b.game==='croc'&&!newPhase&&(d.chat||[]).filter(m=>m.ok).length>(pd.chat||[]).filter(m=>m.ok).length) sfx('good');
  if(b.game==='emo'&&!newPhase){if((d.wrong||{})[myId]>((pd.wrong||{})[myId]||0)) sfx('bad'); if(d.done?.includes(myId)&&!pd.done?.includes(myId)) sfx('good')}
  if(b.game==='football'&&!newPhase&&String(d.goals)!==String(pd.goals)) sfx('goal');
  if(b.game==='phone'&&!newPhase&&d.stage!==pd.stage) sfx(d.stage==='reveal'?'start':'beep');
}
function rtSounds(){
  const e=CS.ents&&CS.ents[myId];
  if(e){
    if(CS.pa===1&&e.alive===0) sfx('boom');
    if(CS.pz0===0&&e.z===1) sfx('bad');
    CS.pa=e.alive; CS.pz0=e.z;
  }
  const sc=CS.s&&CS.s[myId]; if(sc!=null){if(CS.psc!=null&&sc>CS.psc) sfx('coin'); else if(CS.psc!=null&&sc<CS.psc) sfx('bad'); CS.psc=sc}
}
const PH={};  // испорченный телефон: задание и альбом приходят отдельными посылками
function onRt(d){
  if(d.task) PH.task=d.task;
  if(d.album) PH.album=d.album;
  if(!mounted||!view||!CG[view.game]) return;
  if(d.ts){const o=Date.now()-d.ts; CS.off=CS.off==null?o:Math.min(o,CS.off+1)}
  if(d.kb&&CS.me){CS.me.vx+=d.kb[0];CS.me.vy+=d.kb[1];CS.me.x+=d.kb[2];CS.me.y+=d.kb[3]; navigator.vibrate?.(20); sfx('hit'); return}
  if(d.ts&&CS.lastTs&&d.ts<CS.lastTs){CG[view.game].rtOld&&CG[view.game].rtOld(d); return} // устаревшие позиции пропускаем, а события — нет
  if(d.ts) CS.lastTs=Math.max(CS.lastTs||0,d.ts);
  CS.curTs=d.ts;
  CG[view.game].rt&&CG[view.game].rt(d);
  if(OWN[view.game]&&d.p) syncOwn(d);
  rtSounds();
}

function rafLoop(){

    if(mounted!==key) return;
    const dt=Math.min(0.1,(now-last)/1000); last=now;
    try{ownStep(dt); CG[view.game].frame&&CG[view.game].frame(dt,now)}catch(e){console.error(e)}
    requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}

// плавность: чужих рисуем чуть «в прошлом» (на IDELAY мс) и интерполируем между снимками хоста —
// так рывки сети не видны; себя рисуем по своей же локальной симуляции
const IDELAY=120;
const hostNow=()=>Date.now()-(CS.off||0);
function pushBuf(o,ts,x,y){
  o.tx=x; o.ty=y; if(!ts) return;
  const b=o.buf||(o.buf=[]); b.push([ts,x,y]); if(b.length>14) b.shift();
}
function interpObj(o,dt){
  const b=o.buf;
  if(!b||!b.length){if(o.tx!=null){const f=Math.min(1,dt*14); o.x+=(o.tx-o.x)*f; o.y+=(o.ty-o.y)*f} return}
  const t=hostNow()-IDELAY;
  if(t<=b[0][0]){o.x=b[0][1];o.y=b[0][2];return}
  for(let i=b.length-1;i>=0;i--) if(b[i][0]<=t){
    const n=b[i+1];
    if(!n){o.x=b[i][1];o.y=b[i][2]}
    else{const k=(t-b[i][0])/((n[0]-b[i][0])||1); o.x=b[i][1]+(n[1]-b[i][1])*k; o.y=b[i][2]+(n[2]-b[i][2])*k}
    return;
  }
}
function updEnts(list,extra){
  CS.ents=CS.ents||{}; const ids={};
  list.forEach(a=>{const id=a[0]; ids[id]=1; let e=CS.ents[id]; if(!e) e=CS.ents[id]={x:a[1],y:a[2]}; pushBuf(e,CS.curTs,a[1],a[2]); extra&&extra(e,a)});
  for(const id in CS.ents) if(!ids[id]) delete CS.ents[id];
}
function lerpEnts(dt){
  const own=OWN[view.game]&&CS.me;
  for(const id in CS.ents||{}){const e=CS.ents[id]; if(own&&id===myId){e.x=CS.me.x;e.y=CS.me.y} else interpObj(e,dt)}
}
// своя позиция: берём у хоста только при старте и телепортах (ep), дальше считаем сами
function syncOwn(d){
  const a=d.p.find(x=>x[0]===myId); if(!a){CS.me=null;return}
  const ep=(d.ep&&d.ep[myId])|0;
  if(!CS.me||ep>CS.me.ep) CS.me={x:a[1],y:a[2],vx:0,vy:0,ep};
}
function ownStep(dt){
  const cfg=OWN[view.game], me=CS.me; if(!cfg||!me) return;
  if(cfg.off&&cfg.off()){me.vx=0;me.vy=0;return}
  const v=getJoy();
  if(cfg.step) return cfg.step(me,v,dt);
  if(cfg.phys) physMove(me,v,dt,cfg.acc,cfg.damp);
  else{const sp=cfg.speed(); me.vx=v.x*sp; me.vy=v.y*sp; me.x+=me.vx*dt; me.y+=me.vy*dt}
  if(cfg.lo!=null){
    if(me.x<cfg.lo){me.x=cfg.lo;me.vx=Math.max(0,me.vx)} if(me.x>cfg.hi){me.x=cfg.hi;me.vx=Math.min(0,me.vx)}
    if(me.y<cfg.lo){me.y=cfg.lo;me.vy=Math.max(0,me.vy)} if(me.y>cfg.hi){me.y=cfg.hi;me.vy=Math.min(0,me.vy)}
  }
  if(cfg.obst) pushOut(me,26);
}
function gridFree(x,y,r){
  const N=view.data.N, g=view.data.g;
  for(const [ox,oy] of [[-r,-r],[r,-r],[-r,r],[r,r]]){const cx=Math.floor((x+ox)/100), cy=Math.floor((y+oy)/100); if(cx<0||cy<0||cx>=N||cy>=N||g[cy*N+cx]!=='0') return false}
  return true;
}
function hideStep(me,v,dt){
  // скорость зависит от того, насколько отведён палец: чуть-чуть — крадёшься тихо, до конца — бежишь (шумно)
  const e=CS.ents[myId], m=Math.hypot(v.x,v.y), l=Math.min(1,m); if(l<.12){me.vx=me.vy=0;return}
  const sp=(e&&e.role?310:290)*l; me.vx=v.x/m*sp; me.vy=v.y/m*sp;
  const nx=me.x+me.vx*dt, ny=me.y+me.vy*dt;
  if(gridFree(nx,me.y,28)) me.x=nx; if(gridFree(me.x,ny,28)) me.y=ny;
}
function royaleStep(me,v,dt){
  const k=keys, turn=(k.arrowright||k.e||k['у']?1:0)-(k.arrowleft||k.q||k['й']?1:0);
  CS.ang=(CS.ang??0)+turn*2.6*dt;
  let mx,my;
  if(CS.jid!=null){mx=CS.jv.x;my=CS.jv.y}
  else {mx=(k.d||k['в']?1:0)-(k.a||k['ф']?1:0); my=(k.s||k['ы']||k.arrowdown?1:0)-(k.w||k['ц']||k.arrowup?1:0)}
  const fwd=-my, str=mx, ca=Math.cos(CS.ang), sa=Math.sin(CS.ang), l=Math.max(1,Math.hypot(fwd,str)), sp=270*dt/l;
  const dx=(ca*fwd-sa*str)*sp, dy=(sa*fwd+ca*str)*sp;
  if(gridFree(me.x+dx,me.y,22)) me.x+=dx; if(gridFree(me.x,me.y+dy,22)) me.y+=dy;
  me.vx=dx/dt; me.vy=dy/dt;
}
// поворот камеры в 3D: палец на правой половине экрана
addEventListener('pointermove',e=>{if(mounted&&CS.lid===e.pointerId){CS.ang=(CS.ang||0)+(e.clientX-CS.lx)*.009; CS.lx=e.clientX}});
const endLook=e=>{if(CS.lid===e.pointerId) CS.lid=null}; addEventListener('pointerup',endLook); addEventListener('pointercancel',endLook);
function doDash(){
  const cfg=OWN[view?.game], me=CS.me, now=Date.now();
  if(!cfg||!cfg.phys||!me||(cfg.off&&cfg.off())||now<(CS.dcd||0)) return;
  let v=getJoy(); if(Math.hypot(v.x,v.y)<.2){const l=Math.hypot(me.vx,me.vy)||1; v={x:me.vx/l,y:me.vy/l}}
  const l=Math.hypot(v.x,v.y)||1; me.vx+=v.x/l*750; me.vy+=v.y/l*750; CS.dcd=now+1600;
  sendIn({dash:1}); navigator.vibrate?.(30);
}

function joySetup(){

  frame(dt){

 },

 paint:{

 tug:{
  shell:v=>{
    const t=v.data.teams, a=t.a.includes(myId), b=t.b.includes(myId);

  },

    CS.fit=()=>{const dpr=Math.min(2,devicePixelRatio||1); cv.width=cv.clientWidth*dpr; cv.height=170*dpr; CS.dpr=dpr}; CS.fit();

  rt(d){CS.pos=d.pos},
  frame(dt,now){

    c.strokeStyle='#c9a26b'; c.lineWidth=10; c.beginPath(); c.moveTo(0,105); c.lineTo(W,105); c.stroke();

    list(CS.teams.a,'left',8); list(CS.teams.b,'right',W-8);
    setHud(`<span style="color:#ff6b7f">🔴 ←</span><span>Твоих тапов: ${CS.my}</span><span style="color:#6aa5ff">→ 🔵</span>`);

 },
 targets:{
  shell:()=>`<div id="rt" class="rtwrap"><div class="hud" id="hud"></div><div class="cw"><canvas id="cv"></canvas></div></div>`,
  mount(){
    setupCanvas(20); CS.t=[]; CS.born={}; CS.pops=[]; CS.sc={}; CS.gone={};
    CS.cv.addEventListener('pointerdown',e=>{
      e.preventDefault(); const p=toWorld(e);
      const t=CS.t.find(t=>Math.hypot(t[1]-p.x,t[2]-p.y)<t[3]+18); if(!t) return;
      sendIn({hit:t[0]}); CS.gone[t[0]]=1; CS.t=CS.t.filter(x=>x!==t); navigator.vibrate?.(15); sfx('pop');
    });
  },
  rt(d){
    const now=performance.now();
    CS.t=d.t.filter(t=>!CS.gone[t[0]]); CS.t.forEach(t=>{if(!CS.born[t[0]]) CS.born[t[0]]=now});
    CS.sc=d.s; const P=pmap();
    d.h.forEach(([x,y,pid,v])=>CS.pops.push({x,y,txt:(v>0?'+':'')+v+' '+(P[pid]?.name||''),col:P[pid]?.color||'#fff',b:now}));
  },
  frame(dt,now){
    const c=begin();
    c.fillStyle='#1a1a2e'; c.fillRect(0,0,1000,1000);
    for(const [id,x,y,r,type] of CS.t){
      const s=Math.min(1,(now-CS.born[id])/150), R=r*s;
      if(type==='b'){c.beginPath();c.arc(x,y,R,0,7);c.fillStyle='#333';c.fill();c.font=`${R*1.2}px system-ui`;c.textAlign='center';c.textBaseline='middle';c.fillText('💀',x,y+3);continue}
      const cols=type==='g'?['#ffd23f','#fff3b0','#ffd23f']:['#ff4d5e','#fff','#ff4d5e'];
      [1,.66,.33].forEach((f,i)=>{c.beginPath();c.arc(x,y,R*f,0,7);c.fillStyle=cols[i];c.fill()});
      if(type==='g'){c.font=`bold ${R*.7}px system-ui`;c.fillStyle='#a06800';c.textAlign='center';c.textBaseline='middle';c.fillText('★',x,y+2)}
    }
    CS.pops=CS.pops.filter(p=>now-p.b<900);
    for(const p of CS.pops){const a=(now-p.b)/900; c.globalAlpha=1-a; c.font='bold 34px system-ui'; c.fillStyle=p.col; c.textAlign='center'; c.fillText(p.txt,p.x,p.y-a*60)}
    c.globalAlpha=1;
    const top=Object.entries(CS.sc).sort((a,b)=>b[1]-a[1])[0];
    setHud(`<span>Твои очки: ${CS.sc[myId]??0}</span><span class="muted">${top?'Лидер: '+pname(top[0])+' ('+top[1]+')':''}</span>`);
  }
 },
 dodge:{
  shell:()=>`<div id="rt" class="rtwrap"><div class="hud" id="hud"></div><div class="cw"><canvas id="cv"></canvas></div>${meCtl}</div>`,
  mount(v){
    setupCanvas(50); joySetup();
    const r=mulberry32(v.data.seed), b=[]; let t=1.5;
    while(t<62){const w=50+r()*110; b.push({t,x:w/2+r()*(1000-w),w,h:36+r()*22,sp:380+t*10+r()*120}); t+=Math.max(0.12,0.6-t*0.009)*(0.6+r()*0.8)}
    CS.blocks=b; CS.t0=performance.now()-(v.data.el||0); CS.me={x:500,dead:false,t:0}; CS.others={}; CS.ls=0;
    CS.part=v.players.some(p=>p.id===myId);
  },
  rt(d){d.p.forEach(([id,x,dead])=>{if(id===myId) return; const o=CS.others[id]||(CS.others[id]={x}); o.tx=x; o.dead=dead})},
  frame(dt,now){
    const t=(now-CS.t0)/1000, me=CS.me, Y=880, R=22;
    if(!me.dead){
      me.x=clamp(me.x+getJoy().x*650*dt,R,1000-R); me.t=t;
      for(const b of CS.blocks){
        if(b.t>t) break; const y=-60+(t-b.t)*b.sp; if(y>1060) continue;
        const cx=clamp(me.x,b.x-b.w/2,b.x+b.w/2), cy=clamp(Y,y,y+b.h);
        if(Math.hypot(me.x-cx,Y-cy)<R-3){me.dead=true; sendIn({x:Math.round(me.x),dead:1,t:+t.toFixed(2)}); navigator.vibrate?.(250); sfx('boom'); break}
      }
      if(now-CS.ls>60){sendIn({x:Math.round(me.x)}); CS.ls=now}
    }
    const c=begin(), P=pmap();
    const g=c.createLinearGradient(0,0,0,1000); g.addColorStop(0,'#0b0b25'); g.addColorStop(1,'#2a1740'); c.fillStyle=g; c.fillRect(0,0,1000,1000);
    c.fillStyle='#3a2a50'; c.fillRect(0,Y+R+6,1000,1000);
    c.fillStyle='#c9673a';
    for(const b of CS.blocks){if(b.t>t) break; const y=-60+(t-b.t)*b.sp; if(y>1060) continue; c.beginPath(); c.roundRect?c.roundRect(b.x-b.w/2,y,b.w,b.h,12):c.rect(b.x-b.w/2,y,b.w,b.h); c.fill()}
    for(const id in CS.others){const o=CS.others[id]; o.x+=(o.tx-o.x)*Math.min(1,dt*14); c.globalAlpha=o.dead?.25:.6; drawBody(c,o.x,Y,R,o.dead?'#666':(P[id]?.color||'#888'),P[id]?.name,false,o.dead?'✖':P[id]?.av)}
    c.globalAlpha=1; drawBody(c,me.x,Y,R,me.dead?'#666':(P[myId]?.color||'#fff'),'ТЫ',true,me.dead?'💥':P[myId]?.av);
    const alive=Object.values(CS.others).filter(o=>!o.dead).length+(me.dead?0:1);
    setHud(`<span>${me.dead?'💥 Продержался '+me.t.toFixed(1)+' с':'⏱ '+t.toFixed(1)+' с'}</span><span>Живых: ${alive}</span>`);
  }
 },
 croc:{
  shell:v=>{
    const dr=v.data.drawer===myId;
    const cols=['#111111','#e8364f','#2f7cf6','#22b35e','#ffc21a','#8b5a2b','#ff7ac8','#ffffff'];
    return `<div id="rt" class="rtwrap" style="touch-action:auto"><div class="hud" id="hud"></div><div class="cw"><canvas id="cv"></canvas></div>
    ${dr?`<div class="tools">${cols.map((c,i)=>`<span class="sw ${i?'':'on'}" data-col="${c}" style="background:${c}"></span>`).join('')}</div>
      <div class="tools"><button class="tb" data-w="5">тонко</button><button class="tb on" data-w="10">средне</button><button class="tb" data-w="26">жирно</button><button class="tb" data-clr>🗑 очистить</button><button class="tb" data-skip>🔄 другое слово</button></div>`:''}
    <div id="chat" class="chat"></div>
    ${dr?'':`<form id="gform" class="gform"><input id="ginp" autocomplete="off" maxlength="30" placeholder="Что это? Пиши сюда…"><button class="btn primary">➤</button></form>`}</div>`;
  },
  mount(v){
    const dr=v.data.drawer===myId;
    setupCanvas(dr?140:150,true); CS.strokes={}; CS.cur=null; CS.sid=Date.now()%1e9; CS.color='#111111'; CS.w=10; CS.pend=[]; CS.pid=null; CS.lf=0;
    const redraw=()=>{const c=begin(); c.fillStyle='#fff'; c.fillRect(0,0,1000,1000); for(const id in CS.strokes) drawStroke(CS.strokes[id],0)};
    CS.onResize=redraw; CS.redraw=redraw; redraw();
    const cv=CS.cv;
    if(dr){
      cv.addEventListener('pointerdown',e=>{
        e.preventDefault(); cv.setPointerCapture(e.pointerId); flushCroc();
        const p=toWorld(e); CS.cur={c:CS.color,w:CS.w,p:[p.x,p.y,p.x,p.y]}; const id=++CS.sid; CS.strokes[id]=CS.cur;
        CS.pid=id; CS.pend=[p.x,p.y,p.x,p.y]; drawStroke(CS.cur,0);
      });
      cv.addEventListener('pointermove',e=>{
        if(!CS.cur) return; const p=toWorld(e), s=CS.cur, n=s.p.length;
        if(Math.hypot(p.x-s.p[n-2],p.y-s.p[n-1])<4) return;
        s.p.push(p.x,p.y); CS.pend.push(p.x,p.y); drawStroke(s,n-2);
      });
      const up=()=>{if(CS.cur){CS.cur=null; flushCroc()}};
      cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
      $('#rt').addEventListener('click',e=>{
        const sw=e.target.closest('[data-col]'), w=e.target.closest('[data-w]');
        if(sw){CS.color=sw.dataset.col; document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===sw))}
        if(w){CS.w=+w.dataset.w; document.querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('on',x===w))}
        if(e.target.closest('[data-clr]')){CS.strokes={}; CS.redraw(); send({k:'clear'})}
        if(e.target.closest('[data-skip]')){send({k:'skip'}); e.target.closest('[data-skip]').remove()}
      });
    } else {
      $('#gform').addEventListener('submit',e=>{e.preventDefault(); const i=$('#ginp'), t=i.value.trim(); if(t) send({k:'guess',text:t}); i.value=''; i.focus()});
    }
  },
  update(v){
    const d=v.data, dr=d.drawer===myId, got=d.guessed.includes(myId);
    setHud(dr?`<span>✏️ Рисуй: <b style="color:var(--warn);font-size:22px">${esc(d.word||'')}</b></span>${d.skipped?'':''}`
      :got?`<span style="color:var(--ok)">✅ Угадал! Это «${esc(d.word||'')}»</span>`
      :`<span>Рисует ${pname(d.drawer)}</span><span style="letter-spacing:4px;font-size:20px">${esc(d.hint)}</span>`);
    const ch=$('#chat');
    if(ch) ch.innerHTML=d.chat.map(m=>m.ok?`<div class="ok">✅ ${esc(m.n)} угадал!</div>`:`<div><b style="color:${m.c}">${esc(m.n)}:</b> ${esc(m.t)}${m.cl?' <span class="cl">🔥 почти!</span>':''}</div>`).join('');
    const f=$('#gform'); if(f&&got) f.style.display='none';
  },
  rt(d){
    if(d.clear){CS.strokes={}; CS.redraw()}
    if(d.full){CS.strokes={}; for(const id in d.full){const s=d.full[id]; CS.strokes[id]={c:s.c,w:s.w,p:s.p.slice()}} CS.redraw()}
    if(d.d) for(const [id,c,w,pts] of d.d){const s=CS.strokes[id]||(CS.strokes[id]={c,w,p:[]}); const n=s.p.length; s.p.push(...pts); drawStroke(s,Math.max(0,n-2))}
  },
  frame(dt,now){if(CS.pend.length>4&&now-CS.lf>60){flushCroc(true); CS.lf=now}}
 },
};

function noise(dur,vol=.3,at=0,lp=1200){
  const a=audio(); if(!a||muted) return;
  const t=a.currentTime+at, b=a.createBuffer(1,Math.ceil(a.sampleRate*dur),a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=b; f.type='lowpass'; f.frequency.value=lp; g.gain.value=vol;
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
const SFX={
  click:()=>tone(660,.05,'square',.06),
  tick:()=>tone(1000,.05,'sine',.12),
  beep:()=>tone(880,.15,'square',.1),
  go:()=>{tone(523,.1,'square',.1);tone(784,.2,'square',.1,.1)},
  start:()=>[392,523,659,784].forEach((f,i)=>tone(f,.12,'triangle',.12,i*.09)),
  coin:()=>{tone(988,.06,'square',.08);tone(1319,.15,'square',.08,.06)},
  hit:()=>noise(.12,.25,0,700),
  boom:()=>{noise(.6,.5,0,500);tone(110,.5,'sawtooth',.15,0,40)},
  pop:()=>tone(600,.08,'sine',.15,0,1400),
  good:()=>{tone(659,.1,'triangle',.12);tone(988,.18,'triangle',.12,.1)},
  bad:()=>tone(220,.3,'sawtooth',.1,0,110),
  goal:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.15,'square',.1,i*.1));noise(.8,.15,0,3000)},
  win:()=>[523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,i===7?.5:.13,'triangle',.14,[0,.13,.26,.39,.6,.78,.9,1.05][i])),
  pump:n=>tone(200+Math.min(n,60)*12,.06,'sine',.1),
  alarm:()=>{tone(880,.1,'square',.1);tone(660,.1,'square',.1,.12);tone(880,.1,'square',.1,.24)},
  shot:()=>{noise(.12,.45,0,2600);tone(180,.08,'square',.12,0,60)},
  shot2:()=>noise(.08,.12,0,1800),
  pad:i=>tone([330,440,554,659][i]||440,.25,'triangle',.15),
};
function sfx(n,arg){try{SFX[n]&&SFX[n](arg)}catch(e){}}

// ================== ДЕЙСТВИЯ ==================
function getName(){const n=($('#name')?.value||'').trim().slice(0,14); if(n) store('localStorage','up_name',n); return n}
function sinceShown(){return Math.round(performance.now()-(seen[stateKey(view)]||performance.now()))}
const ACT={
  create(){const n=getName(); if(!n){err='Введи имя';render();return} err=''; lastName=n; ui='connecting'; render(); hostCreate(n); wake()},
  join(){const n=getName(), c=($('#code')?.value||'').toUpperCase(); if(!n){err='Введи имя';render();return} if(c.length!==4){err='Код — 4 буквы';render();return} err=''; joinRoom(c,n); wake()},
  rejoin(){err=''; joinRoom(lastCode,lastName,true)},
  leave(){location.href=location.pathname},
  copy(){const l=roomLink(); (navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>toast('Ссылка скопирована')).catch(()=>prompt('Скопируй ссылку:',l))},
  rounds(v){send({k:'rounds',v})},
  toggle(v){send({k:'toggle',v})},
  preset(v){send({k:'preset',v})},
  start(){send({k:'start'})},
  next(){send({k:'next'})},
  again(){send({k:'again'})},
  pass(v){send({k:'pass',to:v})},
  opt(v){const k=view.round+':'+view.phase; mine[k]=view.data.opts[v]; send({k:'ans',i:+v,ms:sinceShown()})},
  num(v){mine[view.round+':'+view.phase]=v; send({k:'num',v:+v})},
  vote(v){send({k:'vote',key:v})},
  mode(v){send({k:'mode',v})},
  mega(v){send({k:'mega',v})},
  cfg(v){const i=v.indexOf(':'); send({k:'cfg',key:v.slice(0,i),v:v.slice(i+1)})},
  avatar(v){send({k:'avatar',v}); sfx('click')},
  fs(){goFull()},
  snd(){muted=!muted; store('localStorage','up_mute',muted?'1':'0'); render(); if(!muted) sfx('coin')},
  who(v){mine[view.round+':'+view.phase]=pmap()[v]?.name||''; send({k:'who',v})},
  submit(){
    const el=$('#inp'); if(!el) return; const val=el.value.trim(); if(!val) return;
    if(view.game==='guess'){if(!isFinite(parseFloat(val.replace(',','.')))){el.value='';return} mine[view.round+':'+view.phase]=val; send({k:'guess',v:val})}
    else if(view.game==='emo'){el.value=''; send({k:'emo',text:val,ms:sinceShown()})}
    else send({k:'quip',text:val});
  },
};
function toast(t){const b=$('.btn[data-a="copy"]'); if(b){const o=b.textContent;b.textContent=t;setTimeout(()=>b.textContent=o,1500)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]'); if(!b||b.disabled) return; if(b.dataset.a!=='snd') sfx('click'); ACT[b.dataset.a]?.(b.dataset.v)});
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('[data-tap]'); if(!t||!view||view.phase!=='play'||view.game!=='react') return;
  e.preventDefault();
  const k=view.round+':play';
  if(view.data.stage==='wait'){mine[k+'r']='Фальстарт 😬 −1'; send({k:'tap'})}
  else {const ms=sinceShown(); mine[k+'r']=`${ms} мс ⚡`; send({k:'tap',ms})}
});
let wl=null;
async function wake(){try{wl=await navigator.wakeLock?.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&wl) wake()});

render();
</script>
